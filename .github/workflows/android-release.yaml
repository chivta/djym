name: Android release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
        shell: bash
    env:
      CI: '1'
      EXPO_PUBLIC_API_URL: https://gymbro.chivtar.dev/api
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          package-manager-cache: false
      # Expo 57 / React Native's Gradle plugin aligns Java and Kotlin to 17.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate signing secrets and decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/djym-release.p12"
          echo "ANDROID_KEYSTORE_PATH=$ANDROID_KEYSTORE_PATH" >> "$GITHUB_ENV"
          for name in ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS; do
            if [[ -z "${!name}" ]]; then
              echo "Missing repository secret: $name" >&2
              exit 1
            fi
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode \
            > "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"
      - run: npm ci
      - name: Validate app and release tooling
        run: |
          npm run typecheck
          npm test
          node --test scripts/android-release.test.mjs
          npx expo install --check
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
      - name: Configure signed release and version
        id: version
        run: node scripts/android-release.mjs
      - name: Assemble standalone release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cd android
          ./gradlew :app:assembleRelease --no-daemon
      - name: Verify signature and prepare assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f \
            -name apksigner | sort -V | tail -n 1)
          test -n "$apksigner"
          "$apksigner" verify --verbose "$apk"
          mkdir -p release-assets
          cp "$apk" "release-assets/djym-$VERSION.apk"
          cd release-assets
          sha256sum "djym-$VERSION.apk" > "djym-$VERSION.apk.sha256"
      - name: Upload smoke-build artifacts
        if: github.event_name == 'workflow_dispatch'
        # actions/upload-artifact v7
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: djym-android-${{ github.run_number }}
          path: mobile/release-assets/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload assets to the published release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "release-assets/djym-$VERSION.apk" \
            "release-assets/djym-$VERSION.apk.sha256" --clobber
      - name: Remove decoded signing key
        if: always()
        run: rm -f -- "$ANDROID_KEYSTORE_PATH"
