apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: >-
      gymbro-api-strip-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: gymbro.chivtar.dev
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
