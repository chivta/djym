<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gymbro API — Swagger UI</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.34.0/swagger-ui.css" integrity="sha384-4c3vsE5f+trhFyHrFrLM1fFGUn531NIaC7dcqEWIJdoRQJ5CkJbSuSCwXLpaS1KF" crossorigin="anonymous">
</head>
<body>
  <div id="swagger-ui"></div>
  <noscript>Enable JavaScript to use Swagger UI. <a href="/swagger/openapi.json">OpenAPI specification</a></noscript>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.34.0/swagger-ui-bundle.js" integrity="sha384-9Td7MKiIr2S83E1kZyyVi8KdJw/S8CpAvu0llLyMeg0xq/hDGiZJfVn0fV4llCmK" crossorigin="anonymous"></script>
  <script>
    window.onload = function () {
      SwaggerUIBundle({
        url: "/swagger/openapi.json",
        dom_id: "#swagger-ui",
        validatorUrl: null,
        persistAuthorization: false,
        requestInterceptor: function (request) {
          // Required only for cookie-authenticated workout/program mutations.
          if (/^(POST|PUT|DELETE)$/.test(request.method) && /\/v1\/users\/[^/]+\/(workouts|programs)(\/|$)/.test(request.url)) {
            request.headers["X-Gymbro-Write"] = "1";
          }
          return request;
        }
      });
    };
  </script>
</body>
</html>
